# 一次性診斷用。只能手動觸發，不含任何 secret。
# 第一輪已確認：gamma-api 正常，data-api v1 整個退役（410）。
# 這一輪要抓 v2 的規格並實測參數，查完就刪掉這個檔案。
name: diag-polymarket

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 抓官方遷移文件
        run: |
          for u in \
            "https://docs.polymarket.com/migrate/data-api-v1-to-v2.md" \
            "https://docs.polymarket.com/api-reference/data-api/migrating-from-v1.md" ; do
            echo "=============================================================="
            echo "▶ $u"
            echo "--------------------------------------------------------------"
            curl -sS -L --max-time 30 "$u" | head -c 12000
            echo; echo
          done

      - name: 實測 v2 /trades 的參數組合
        run: |
          EVENT_ID=848410
          probe () {
            echo "=============================================================="
            echo "▶ $1"
            code=$(curl -sS -o /tmp/b.txt -w '%{http_code}' \
                   -H 'Accept: application/json' --max-time 30 "$1")
            echo "HTTP $code"
            head -c 900 /tmp/b.txt; echo; echo
          }

          B=https://data-api.polymarket.com/v2/trades

          probe "$B?limit=2"
          probe "$B?event_id=${EVENT_ID}&limit=2"
          probe "$B?eventId=${EVENT_ID}&limit=2"
          probe "$B?event_id=${EVENT_ID}&taker_only=true&limit=2"
          probe "$B?event_id=${EVENT_ID}&limit=2&offset=0"
