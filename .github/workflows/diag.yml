# 一次性診斷用。只能手動觸發，不含任何 secret，純粹對 Polymarket 的公開 API
# 打幾發 curl 看狀態碼。查清楚 2026-11-03 開始的 HTTP 410 之後就可以刪掉這個檔案。
#
# 為什麼要繞到 GitHub 上跑：台灣的 IP 被 Polymarket 擋著，本機 curl 連不出去，
# 而 GitHub 的執行機在美國，打得通。
name: diag-polymarket

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 逐一測試 API 端點
        run: |
          EVENT_ID=848410
          UA='tw-election-polymarket-tracker/2.0'

          probe () {
            echo "=============================================================="
            echo "▶ $1"
            echo "--------------------------------------------------------------"
            # -s 安靜 -S 仍顯示錯誤 -D - 把回應標頭印到 stdout
            curl -sS -D - -o /tmp/body.txt -A "$UA" -H 'Accept: application/json' \
                 --max-time 30 "$1" || echo "(curl 本身失敗，離開碼 $?)"
            echo "--- body 前 600 字元 ---"
            head -c 600 /tmp/body.txt || true
            echo
            echo
          }

          # 1. 現在程式在用的寫法（query string 帶 id）
          probe "https://gamma-api.polymarket.com/events?id=${EVENT_ID}"

          # 2. RESTful 寫法（路徑帶 id）——如果 1 被棄用，通常是改成這種
          probe "https://gamma-api.polymarket.com/events/${EVENT_ID}"

          # 3. 不帶任何條件，確認 /events 這個端點本身還活著
          probe "https://gamma-api.polymarket.com/events?limit=1"

          # 4. 成交明細 API
          probe "https://data-api.polymarket.com/trades?eventId=${EVENT_ID}&takerOnly=true&limit=2&offset=0"

          # 5. 不帶條件的成交明細，確認 data-api 本身還活著
          probe "https://data-api.polymarket.com/trades?limit=1"

          # 6. 用 slug 查這場選舉盤，看是不是整個 event 被下架了
          probe "https://gamma-api.polymarket.com/events?slug=keelung-mayor-election-winner-20260813135716100"
