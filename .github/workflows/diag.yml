# 一次性診斷用。只能手動觸發，不含任何 secret，不寫檔也不寄信。查完就刪。
name: diag-polymarket

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 驗證 Data API v2 遷移
        run: python3 scripts/verify_api_v2.py
