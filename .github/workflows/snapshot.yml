# 這個 workflow 跑在 GitHub 的機器上（美國），不受台灣 IP 封鎖影響。
# 它負責定時抓資料並 commit 回 repo，讓沒有 VPN 的人也能在網頁上看到資料。

name: snapshot

on:
  schedule:
    # 每 3 小時的第 5 分鐘執行一次（UTC）。GitHub 的排程常有數分鐘延遲，屬正常現象。
    # 這個盤成交稀疏，抓太頻繁只會讓 repo 累積大量內容相同、只有時間戳不同的 commit。
    - cron: '5 */3 * * *'
  workflow_dispatch:        # 允許在 Actions 頁面手動觸發
    inputs:
      test_email:
        description: '寄一封測試信（驗證郵件設定是否正常，不會動到錢包名冊）'
        type: boolean
        default: false

permissions:
  contents: write           # 需要寫入權限才能 commit 快照

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取快照
        run: python3 scripts/snapshot.py ${{ inputs.test_email && '--test-email' || '' }}

      # 先存檔再寄信：萬一寄信失敗，資料至少已經保住，網站不會因為
      # 郵件設定的問題而拿到過期快照。寄信失敗會讓整個 workflow 標記為失敗，
      # GitHub 會另外寄「執行失敗」通知，所以不會默默漏掉。
      - name: 有變動才 commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json snapshots/ seen_wallets.json
          if git diff --staged --quiet; then
            echo "資料沒有變化，跳過 commit"
          else
            COUNT=$(python3 -c "import json;print(json.load(open('data.json'))['total_trades'])")
            git commit -m "snapshot: ${COUNT} 筆成交 @ $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi

      # snapshot.py 只在偵測到新錢包時才產生 new_wallets.html，
      # 所以這個檔案存在與否就是「要不要寄信」的判斷依據。
      - name: 讀取通知內容
        id: notify
        run: |
          if [ -f new_wallets.html ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
            echo "subject=$(cat new_wallets_subject.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "沒有新錢包，不寄信"
          fi

      - name: 寄送新錢包通知
        if: steps.notify.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: 基隆盤監控 <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO || secrets.MAIL_USERNAME }}
          subject: ${{ steps.notify.outputs.subject }}
          html_body: file://new_wallets.html
          convert_markdown: false
