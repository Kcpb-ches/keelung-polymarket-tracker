name = "keelung-polymarket-cron"
main = "src/index.js"
compatibility_date = "2026-09-29"

# 關掉所有對外網址。這支 Worker 只接受 Cloudflare 內部的排程事件，
# 沒有 fetch handler，本來就不該有人能從外面呼叫它——
# 留著公開網址只是讓別人有機會一直戳、把 Actions 灌爆。
# 不明講的話 wrangler 預設會幫你開，deploy 時會跳 WARNING 提醒。
workers_dev = false
preview_urls = false

# 每 5 分鐘觸發一次。
#
# snapshot.yml 裡的 GitHub 排程（每小時 :30）保留不動，
# 當作這支 Worker 萬一掛掉時的備援。
#
# ⚠️ 一天會跑 288 次，也就是 288 個 commit——因為 data-*.json 裡的
#    fetched_at 每輪都會變，workflow 的「有變動才 commit」判斷一定成立。
#    若覺得 repo 被洗版，要改的是 snapshot.yml 的比對方式，不是這裡。
# 2026-11-03 暫停：Polymarket API 回 HTTP 410 Gone，每一輪都失敗。
# 空陣列代表「移除所有排程」，deploy 後 Cloudflare 就不會再觸發。
# 修好之後把下面那行換回 crons = ["*/5 * * * *"] 再 deploy 一次即可。
[triggers]
crons = []
